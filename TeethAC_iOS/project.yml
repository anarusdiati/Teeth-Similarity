# XcodeGen — hasilkan TeethAC.xcodeproj dengan satu perintah:
#   brew install xcodegen        # sekali saja
#   cd TeethAC_iOS && xcodegen generate
#   open TeethAC.xcodeproj
name: TeethAC
options:
  bundleIdPrefix: com.teethac
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  TeethAC:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
      - path: model/DINOv2Teeth.mlpackage
        optional: true          # ada setelah kamu jalankan convert_dinov2_coreml.py
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.teethac.app
        PRODUCT_NAME: TeethAC
        GENERATE_INFOPLIST_FILE: "YES"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"     # iPhone + iPad
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UIRequiresFullScreen: "YES"
        # DEVELOPMENT_TEAM: ""            # isi Team ID kalau run di iPhone fisik
